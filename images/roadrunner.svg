<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbeed2"/><stop offset="1" stop-color="#f3d9a6"/></linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#sky)"/>
  <!-- road: parallel thread lanes -->
  <rect y="150" width="200" height="50" fill="#5c676e"/>
  <g stroke="#fbeed2" stroke-width="4" stroke-linecap="round" stroke-dasharray="16 14">
    <line x1="-6" y1="166" x2="206" y2="166"/>
    <line x1="4" y1="184" x2="206" y2="184"/>
  </g>
  <!-- speed lines -->
  <g stroke="#c98a2a" stroke-width="5" stroke-linecap="round">
    <line x1="14" y1="78" x2="46" y2="78"/>
    <line x1="6" y1="98" x2="44" y2="98"/>
    <line x1="18" y1="118" x2="50" y2="118"/>
  </g>
  <!-- roadrunner -->
  <g fill="#006666" stroke="#006666" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail -->
    <path d="M98 106 L44 72 L56 56 L110 96 Z" stroke-width="4"/>
    <!-- body -->
    <path d="M90 104 C96 86 120 80 136 86 C142 98 132 116 112 122 C98 126 86 116 90 104 Z" stroke-width="2"/>
    <!-- neck & head -->
    <path d="M128 92 C134 76 140 62 150 56 C160 50 170 56 168 64 C164 72 150 76 142 96 Z" stroke-width="2"/>
    <!-- crest -->
    <path d="M150 56 L144 38 L156 52 L156 34 L162 52 L168 42 L164 58 Z" stroke-width="2"/>
    <!-- beak -->
    <path d="M166 60 L194 66 L166 68 Z" stroke-width="2"/>
    <!-- legs -->
    <path d="M110 120 L100 140 L84 148" fill="none" stroke-width="6"/>
    <path d="M116 120 L132 136 L146 130" fill="none" stroke-width="6"/>
  </g>
  <circle cx="158" cy="60" r="3.5" fill="#fbeed2"/>
  <!-- wing -->
  <path d="M100 104 C110 94 124 92 132 96 C124 106 112 110 100 104 Z" fill="#0a8a80"/>
</svg>
