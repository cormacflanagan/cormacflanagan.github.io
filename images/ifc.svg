<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef7f6"/><stop offset="1" stop-color="#d6ebe8"/></linearGradient>
    <clipPath id="sh"><path d="M100 38 L150 56 V98 C150 132 128 154 100 166 C72 154 50 132 50 98 V56 Z"/></clipPath>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- incoming flows -->
  <path d="M8 70 C40 70 50 92 74 98" fill="none" stroke="#e0a030" stroke-width="7" stroke-linecap="round"/>
  <path d="M8 128 C40 128 50 106 74 102" fill="none" stroke="#3a9a8f" stroke-width="7" stroke-linecap="round"/>
  <!-- outgoing: secret continues high, public low -->
  <path d="M126 98 C150 92 160 70 192 70" fill="none" stroke="#e0a030" stroke-width="7" stroke-linecap="round" stroke-dasharray="0.1 14"/>
  <path d="M126 102 C150 106 160 128 192 128" fill="none" stroke="#3a9a8f" stroke-width="7" stroke-linecap="round"/>
  <!-- shield split into two facets -->
  <g clip-path="url(#sh)">
    <rect x="40" y="30" width="60" height="140" fill="#006666"/>
    <rect x="100" y="30" width="60" height="140" fill="#0a8a80"/>
  </g>
  <path d="M100 38 L150 56 V98 C150 132 128 154 100 166 C72 154 50 132 50 98 V56 Z" fill="none" stroke="#004c4c" stroke-width="5" stroke-linejoin="round"/>
  <!-- padlock -->
  <path d="M86 98 V86 a14 14 0 0 1 28 0 V98" fill="none" stroke="#fdf6e3" stroke-width="7" stroke-linecap="round"/>
  <rect x="78" y="96" width="44" height="36" rx="6" fill="#fdf6e3"/>
  <circle cx="100" cy="110" r="5" fill="#006666"/>
  <rect x="97.5" y="112" width="5" height="11" rx="2" fill="#006666"/>
</svg>
